name: SrikanthMart CI Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install vcpkg bootstrap dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          clang-15 \
          clang-tidy \
          cppcheck \
          curl zip unzip tar pkg-config autoconf autoconf-archive automake libtool bison flex \
          libpq-dev

    - name: Bootstrap vcpkg
      run: |
        git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
        git -C "$RUNNER_TEMP/vcpkg" checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
        "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
        echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

    - name: Run Static Analysis (cppcheck)
      run: |
        cppcheck --enable=all --inconclusive --std=c++20 --suppress=missingIncludeSystem src/

    - name: Configure CMake with ASan & UBSan
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-linux \
          -DENABLE_ASAN=ON

    - name: Build Executable and Test Suites
      run: |
        cmake --build build --config Debug

    - name: Execute CTest Unit and Integration Suites
      run: |
        cd build && ctest --output-on-failure
